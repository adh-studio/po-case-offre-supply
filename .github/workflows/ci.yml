name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests e2e et regeneration du one-pager
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installation des dependances epinglees
        run: pip install -r requirements.txt

      - name: Regeneration du one-pager
        run: python scripts/generate_onepager.py

      - name: Suite de tests pytest
        run: pytest -v

      - name: Verification que le one-pager commite est a jour
        run: git diff --exit-code docs/index.html
